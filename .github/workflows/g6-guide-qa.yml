name: G6 GUIDE quality checks
on:
  push:
    branches: [main]
    paths:
      - 'g6-guide/**'
      - '.github/workflows/g6-guide-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-g6-site:
    name: Content, JavaScript and browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -e
          for file in g6-guide/*.js g6-guide/qa.cjs; do
            node --check "$file"
          done
      - name: Verify all 35 lessons and linked assets
        run: node g6-guide/qa.cjs
      - name: Test desktop and mobile browser rendering
        shell: bash
        run: |
          set -e
          if ! command -v google-chrome >/dev/null; then
            echo "Chrome not installed; data and syntax tests passed."
            exit 0
          fi
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/g6-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          flags="--headless --no-sandbox --disable-gpu --disable-dev-shm-usage --no-first-run --virtual-time-budget=8000"
          google-chrome $flags --window-size=1440,900 --dump-dom http://127.0.0.1:8765/g6-guide/ > /tmp/g6-home.html 2>/tmp/g6-home-err.log
          grep -q 'class="lesson-card"' /tmp/g6-home.html
          google-chrome $flags --window-size=390,844 --dump-dom 'http://127.0.0.1:8765/g6-guide/learning.html?lesson=6' > /tmp/g6-lesson6.html 2>/tmp/g6-lesson-err.log
          grep -q 'מחשבון טעינה ועלות' /tmp/g6-lesson6.html
          grep -q 'מפת תא הנהג\|עמדת GNRGY הביתית' /tmp/g6-lesson6.html
          echo "Browser checks passed: landing page and lesson 6 deep content rendered."